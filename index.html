<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MK! TEMP MAIL | VIP BLUE RED EDITION</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nova+Square&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Audiowide:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070A12;
    --primary:#00BFFF;
    --secondary:#7C3AED;
    --card:#101827;
    --ink:#F8FAFC;
    --ink-soft:#94A3B8;
    --ink-faint:#5C6B85;
    --border:#1E293B;
  }
  *{box-sizing:border-box;font-family:'Inter',sans-serif;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }
  ::selection{background:rgba(0,191,255,0.3);}

  /* Ambient neon glow field */
  body::before, body::after{
    content:"";
    position:fixed;
    border-radius:50%;
    filter:blur(90px);
    z-index:0;
    pointer-events:none;
    opacity:0;
    animation:glowFadeIn 1.6s ease-out 0.15s forwards;
  }
  @keyframes glowFadeIn{
    to{opacity:1;}
  }
  body::before{
    width:420px;height:420px;
    background:rgba(0,191,255,0.20);
    top:-140px;left:-100px;
  }
  body::after{
    width:380px;height:380px;
    background:rgba(124,58,237,0.22);
    bottom:-100px;right:-100px;
  }
  .glow-extra{
    position:fixed;
    width:320px;height:320px;
    border-radius:50%;
    filter:blur(100px);
    background:rgba(236,72,153,0.14);
    top:38%;left:50%;
    transform:translate(-50%,-50%);
    z-index:0;
    pointer-events:none;
    animation:driftGlow 12s ease-in-out infinite;
  }
  @keyframes driftGlow{
    0%,100%{transform:translate(-55%,-52%) scale(1);}
    50%{transform:translate(-45%,-48%) scale(1.15);}
  }
  .grain-overlay{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    opacity:0.35;
    background-image:radial-gradient(rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size:3px 3px;
  }

  .page{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    position:relative;
    z-index:1;
    padding-bottom:20px;
    animation:pageFadeIn 0.9s cubic-bezier(0.22,1,0.36,1) both;
  }
  @keyframes pageFadeIn{
    0%{opacity:0;transform:translateY(18px) scale(0.985);filter:blur(6px);}
    100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0);}
  }

  /* ---------- Header ---------- */
  .hero-top{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:30px 22px 0;
    text-align:center;
  }
  .brand{display:flex;align-items:center;justify-content:center;gap:12px;}
  .brand-text .app-title{
    font-family: 'Audiowide', sans-serif;
    font-size:30px;
    font-weight:900;
    color:#FFFFFF;
    margin:0;
    line-height:1.1;
    letter-spacing:-0.01em;
  }
  .brand-text .app-sub{
    background:linear-gradient(135deg, var(--primary), var(--secondary));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    font-family: 'Audiowide', sans-serif;
    font-size:30px;
    font-weight:900;
    margin:0;
    line-height:1.1;
    letter-spacing:-0.01em;
  }

  /* ---------- Glass cards ---------- */
  .card{
    background:rgba(16,24,39,0.62);
    backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%);
    border:1px solid var(--border);
    border-radius:24px;
    padding:28px 22px 24px;
    margin:26px 16px 0;
    box-shadow:0 0 0 1px rgba(255,255,255,0.03) inset, 0 24px 50px -18px rgba(0,191,255,0.22), 0 2px 14px rgba(0,0,0,0.45);
    position:relative;
    animation:rise 0.5s cubic-bezier(0.22,1,0.36,1) both;
    overflow:hidden;
    transition:transform 0.35s cubic-bezier(0.22,1,0.36,1), box-shadow 0.35s ease;
  }
  .card:hover{
    transform:translateY(-3px);
    box-shadow:0 0 0 1px rgba(255,255,255,0.05) inset, 0 30px 60px -18px rgba(0,191,255,0.3), 0 2px 14px rgba(0,0,0,0.5);
  }
  .card::after{
    content:"";
    position:absolute;
    top:0;left:12%;right:12%;
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(0,191,255,0.7), rgba(124,58,237,0.7), transparent);
  }
  .card-watermark{
    position:absolute;
    top:-18px;right:-18px;
    width:120px;height:120px;
    opacity:0.05;
    pointer-events:none;
    z-index:0;
  }
  .card::before{
    content:"";
    position:absolute;
    top:-40%;left:-20%;
    width:70%;height:180%;
    background:linear-gradient(120deg, rgba(0,191,255,0.10), rgba(124,58,237,0.10) 60%, transparent 70%);
    transform:rotate(12deg);
    pointer-events:none;
  }
  @keyframes rise{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }

  .card h2{
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-family: 'Poppins', sans-serif;
    font-size:18px;
    font-weight:900;
    text-align:center;
    margin:0 0 20px;
    color:var(--ink);
    letter-spacing:-0em;
  }

  .email-box{
    position:relative;
    z-index:1;
    background:rgba(7,10,18,0.65);
    border:1.5px dashed var(--border);
    border-radius:16px;
    padding:19px 18px;
    text-align:center;
    font-family:'Poppins',sans-serif;
    font-size:14px;
    font-weight:900;
    letter-spacing:0em;
    color:#FFFFFF;
    word-break:break-all;
    min-height:24px;
    position:relative;
    transition:border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
  }
  .email-box.active{
    border:1.5px solid transparent;
    background:
      linear-gradient(rgba(6,10,20,0.88),rgba(6,10,20,0.88)) padding-box,
      linear-gradient(135deg, var(--primary), var(--secondary)) border-box;
    box-shadow:0 0 0 1px rgba(0,191,255,0.08), 0 0 30px -6px rgba(0,191,255,0.5), 0 0 24px -8px rgba(0,191,255,0.45) inset;
    text-shadow:0 0 18px rgba(0,191,255,0.4);
    overflow:hidden;
    animation:boxGlowPulse 2.6s ease-in-out infinite;
  }
  @keyframes boxGlowPulse{
    0%,100%{box-shadow:0 0 0 1px rgba(0,191,255,0.08), 0 0 24px -6px rgba(0,191,255,0.4), 0 0 20px -8px rgba(0,191,255,0.4) inset;}
    50%{box-shadow:0 0 0 1px rgba(0,191,255,0.12), 0 0 36px -6px rgba(0,191,255,0.65), 0 0 28px -8px rgba(0,191,255,0.55) inset;}
  }
  .email-placeholder-inner{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .email-placeholder-inner svg{width:17px;height:17px;opacity:0.65;flex-shrink:0;}
  .email-box.active::after{
    content:"";
    position:absolute;
    top:0;left:-150%;
    width:60%;height:100%;
    background:linear-gradient(90deg, transparent, rgba(0,191,255,0.18), transparent);
    animation:shimmer 3.2s ease-in-out infinite;
  }
  @keyframes shimmer{
    0%{left:-60%;}
    100%{left:130%;}
  }
  .email-box.placeholder{
    font-family:'Inter',sans-serif;
    font-weight:900;
    color:var(--ink-faint);
    text-shadow:none;
    font-size:13.5px;
  }

  .expiry-note{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    margin:14px auto 0;
    min-height:16px;
    padding:6px 14px;
    border-radius:999px;
    background:rgba(255,255,255,0.03);
    border:1px solid var(--border);
    width:fit-content;
  }
  .expiry-note:empty{
    padding:0;
    border:none;
    background:transparent;
  }
  .expiry-note svg{width:13px;height:13px;flex-shrink:0;opacity:0.8;}
  .expiry-note strong{color:var(--ink);font-weight:700;}

  .pill-stack{
    display:flex;
    flex-direction:column;
    gap:11px;
    margin-top:22px;
    padding-top:20px;
    border-top:1px solid rgba(255,255,255,0.06);
  }
  .pill{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    border:1px solid #FFFFFF;
    border-radius:12px;
    padding:14px 20px;
    font-family:'Orbitron',sans-serif;
    font-size:14.5px;
    font-weight:900;
    color:#fff;
    cursor:pointer;
    transition:transform 0.15s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s ease, filter 0.15s ease;
    letter-spacing:0em;
  }
  .pill:active{transform:scale(0.965);}
  .pill:hover{filter:brightness(1.08);}
  .pill-icon{
    width:24px;height:24px;
    border-radius:50%;
    background:rgba(255,255,255,0.16);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .pill svg{width:14px;height:14px;flex-shrink:0;}
  .pill-primary{
    background:linear-gradient(135deg,var(--primary),var(--secondary));
    box-shadow:0 8px 24px -6px rgba(0,191,255,0.55);
  }
  .pill-copy{
    background:rgba(0,191,255,0.12);
    color:var(--primary);
    border:1px solid #FFFFFF;
    box-shadow:0 0 18px -8px rgba(0,191,255,0.5);
  }
  .pill-copy .pill-icon{background:rgba(0,191,255,0.16);}
  .pill-refresh{
    background:rgba(124,58,237,0.12);
    color:#C4A6FF;
    border:1px solid #FFFFFF;
    box-shadow:0 0 18px -8px rgba(124,58,237,0.45);
  }
  .pill-refresh .pill-icon{background:rgba(124,58,237,0.18);}
  .pill:hover{filter:brightness(1.12);transform:translateY(-1px);}

  /* ---------- Inbox card ---------- */
  .inbox-card{
    margin:20px 16px 30px;
    background:rgba(16,24,39,0.62);
    backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%);
    border:1px solid var(--border);
    border-radius:24px;
    padding:24px 22px 20px;
    box-shadow:0 0 0 1px rgba(255,255,255,0.03) inset, 0 24px 50px -20px rgba(124,58,237,0.28), 0 2px 14px rgba(0,0,0,0.45);
    position:relative;
    overflow:hidden;
    transition:transform 0.35s cubic-bezier(0.22,1,0.36,1), box-shadow 0.35s ease;
  }
  .inbox-card:hover{
    transform:translateY(-3px);
    box-shadow:0 0 0 1px rgba(255,255,255,0.05) inset, 0 30px 60px -20px rgba(124,58,237,0.38), 0 2px 14px rgba(0,0,0,0.5);
  }
  .inbox-card::after{
    content:"";
    position:absolute;
    top:0;left:12%;right:12%;
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(124,58,237,0.7), rgba(0,191,255,0.7), transparent);
  }
  .inbox-head{display:flex;align-items:center;gap:10px;}
  .inbox-head-icon{
    width:34px;height:34px;
    border-radius:10px;
    background:linear-gradient(135deg,rgba(0,191,255,0.18),rgba(124,58,237,0.18));
    border:1px solid var(--border);
    box-shadow:0 0 16px -4px rgba(124,58,237,0.5);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .inbox-head-icon svg{width:18px;height:18px;color:var(--primary);}
  .inbox-title-group{display:flex;flex-direction:column;}
  .inbox-title{font-size:16.5px;font-weight:800;color:var(--ink);letter-spacing:-0.01em;}
  .inbox-count{font-size:11.5px;color:var(--ink-soft);font-weight:500;margin-left:auto;text-align:right;}

  .divider{
    border:none;
    border-top:1px solid var(--border);
    margin:16px 0;
  }

  .empty-state{
    text-align:center;
    padding:20px 12px 6px;
    color:var(--ink-soft);
    font-weight: 900;
    font-size:13px;
  }
  .empty-illustration{
    width:52px;height:52px;
    margin:0 auto 14px;
    border-radius:16px;
    background:linear-gradient(135deg,rgba(0,191,255,0.14),rgba(124,58,237,0.14));
    border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
  }
  .empty-illustration svg{width:24px;height:24px;color:var(--primary);}
  .empty-state .pulse-row{display:flex;align-items:center;justify-content:center;gap:6px;}

  .mail-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .mail-item{
    background:rgba(7,10,18,0.5);
    border:1px solid var(--border);
    border-radius:14px;
    padding:13px 14px;
    display:flex;
    gap:12px;
    align-items:center;
    cursor:pointer;
    transition:border-color 0.15s ease, transform 0.15s ease, background 0.15s ease;
  }
  .mail-item:hover{border-color:rgba(0,191,255,0.4);background:rgba(0,191,255,0.05);transform:translateY(-1px);}
  .mail-avatar{
    width:36px;height:36px;
    border-radius:11px;
    background:linear-gradient(135deg,var(--primary),var(--secondary));
    color:#fff;
    font-size:13px;
    font-weight:800;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .mail-item.unread .mail-from{font-weight:700;}
  .mail-item.unread .mail-avatar{box-shadow:0 0 0 2px rgba(16,24,39,0.9), 0 0 0 4px rgba(0,191,255,0.35);}
  .mail-body{flex:1;min-width:0;}
  .mail-top{display:flex;justify-content:space-between;gap:10px;}
  .mail-from{font-size:13.5px;color:var(--ink);}
  .mail-time{font-size:11px;color:var(--ink-faint);flex-shrink:0;}
  .mail-subject{font-size:12.5px;color:var(--ink-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .expanded-mail{
    background:rgba(7,10,18,0.5);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
    margin-top:10px;
    animation:rise 0.35s cubic-bezier(0.22,1,0.36,1) both;
  }
  .expanded-mail h3{font-size:16px;font-weight:800;margin:0 0 4px;color:var(--ink);}
  .expanded-mail .exp-meta{font-size:12px;color:var(--ink-soft);margin-bottom:14px;}
  .expanded-mail p{font-size:13.5px;color:var(--ink);margin:0 0 14px;}
  .close-mail{font-size:12.5px;color:var(--primary);cursor:pointer;font-weight:700;background:none;border:none;padding:0;}

  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:rgba(16,24,39,0.92);
    backdrop-filter:blur(12px);
    color:var(--ink);
    padding:11px 20px;
    border:1px solid var(--border);
    border-radius:999px;
    font-size:13px;
    font-weight:600;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s ease, transform 0.2s ease;
    white-space:nowrap;
    box-shadow:0 0 24px -6px rgba(0,191,255,0.35);
    z-index:5;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  footer.foot-note{
    text-align:center;
    font-weight: 900;
    font-size:11.5px;
    color:var(--ink-faint);
    padding:6px 24px 28px;
    position:relative;
    z-index:1;
  }

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  .pill-more-tools{
    position:relative;
    background:rgba(16,24,39,0.55);
    backdrop-filter:blur(16px) saturate(160%);
    -webkit-backdrop-filter:blur(16px) saturate(160%);
    border:1px solid rgba(0,191,255,0.4);
  }
  .pill-more-tools::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:10px;
    border:1.5px solid rgba(0,191,255,0.8);
    animation:pillPulse 1.8s ease-out infinite;
    pointer-events:none;
  }
  @keyframes pillPulse{
    0%{transform:scale(1);opacity:0.8;}
    100%{transform:scale(1.25);opacity:0;}
  }
</style>

<style id="vip-blue-red-redesign">
:root{
  --vip-bg:#02040b;
  --vip-blue:#18a8ff;
  --vip-blue2:#006eff;
  --vip-red:#ff174f;
  --vip-red2:#ff003c;
  --vip-white:#f4f8ff;
  --vip-muted:#93a7c7;
  --vip-panel:rgba(7,12,26,.72);
  --vip-line:rgba(120,190,255,.20);
}
html,body{background:#02040b!important;color:var(--vip-white)!important;}
body{
  font-family:Inter,system-ui,sans-serif!important;
  overflow-x:hidden!important;
  background:
    radial-gradient(circle at 15% 15%,rgba(0,110,255,.18),transparent 30%),
    radial-gradient(circle at 85% 75%,rgba(255,0,60,.14),transparent 30%),
    linear-gradient(135deg,#01030a 0%,#050815 48%,#08020a 100%)!important;
}
body::before{
  content:"";position:fixed;inset:-20%;z-index:0;pointer-events:none;
  background:
    linear-gradient(115deg,transparent 0 43%,rgba(24,168,255,.06) 44%,transparent 45% 62%,rgba(255,23,79,.055) 63%,transparent 64%),
    repeating-linear-gradient(90deg,transparent 0 49px,rgba(90,170,255,.045) 50px,transparent 51px),
    repeating-linear-gradient(0deg,transparent 0 49px,rgba(255,70,100,.035) 50px,transparent 51px);
  transform:perspective(500px) rotateX(60deg) scale(1.8) translateY(8%);
  transform-origin:center bottom;
  animation:vipGrid 14s linear infinite;
}
body::after{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(24,168,255,.055),transparent 35%,transparent 65%,rgba(255,23,79,.055));
  mix-blend-mode:screen;
}
@keyframes vipGrid{to{background-position:0 51px,51px 0,0 51px;}}
.glow-extra,.grain-overlay{display:none!important}
.vip-bg,.vip-bg *{pointer-events:none}
.vip-bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.vip-orb{position:absolute;border-radius:50%;filter:blur(55px);opacity:.55;mix-blend-mode:screen}
.vip-orb.blue{width:340px;height:340px;background:#087dff;left:-90px;top:8%;animation:orbBlue 10s ease-in-out infinite alternate}
.vip-orb.red{width:300px;height:300px;background:#ff003c;right:-80px;bottom:10%;animation:orbRed 12s ease-in-out infinite alternate}
@keyframes orbBlue{to{transform:translate(180px,120px) scale(1.3)}}
@keyframes orbRed{to{transform:translate(-150px,-120px) scale(1.25)}}

.page{
  width:min(92vw,760px)!important;max-width:none!important;margin:0 auto!important;
  padding:28px 0 45px!important;position:relative!important;z-index:2!important;
}
.hero-top{
  padding:30px 18px 24px!important;position:relative!important;
  border:1px solid rgba(255,255,255,.09)!important;border-radius:28px!important;
  background:linear-gradient(135deg,rgba(7,16,36,.78),rgba(28,5,20,.70))!important;
  box-shadow:0 25px 80px rgba(0,0,0,.5),inset 0 1px rgba(255,255,255,.10)!important;
  overflow:hidden!important;
}
.hero-top:before{
  content:"";position:absolute;inset:0;padding:1px;border-radius:28px;
  background:linear-gradient(110deg,#18a8ff,transparent 35%,transparent 65%,#ff174f);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;opacity:.75;
}
.hero-top:after{
  content:"";position:absolute;left:-30%;top:0;width:55%;height:2px;
  background:linear-gradient(90deg,transparent,#fff,#18a8ff,transparent);
  box-shadow:0 0 20px #18a8ff;animation:scan 4s linear infinite;
}
@keyframes scan{to{left:110%}}
.brand{position:relative;z-index:1}
.brand-text .app-title{
  font-size:clamp(38px,10vw,68px)!important;font-weight:1000!important;
  letter-spacing:.12em!important;line-height:.95!important;margin:0!important;
  color:#fff!important;text-shadow:0 0 18px rgba(24,168,255,.65),0 0 42px rgba(255,23,79,.22)!important;
}
.brand-text .app-sub{
  margin:10px 0 0!important;font-size:clamp(16px,4vw,23px)!important;
  letter-spacing:.45em!important;font-weight:900!important;

  backdrop-filter:blur(22px) saturate(150%)!important;-webkit-backdrop-filter:blur(22px) saturate(150%)!important;

.card{padding:30px 24px!important;position:relative!important;overflow:hidden!important}

  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,rgba(24,168,255,.07),transparent 35%,transparent 65%,rgba(255,23,79,.07));

 body::before,.vip-orb,.hero-top:after{animation:none!important}

<body>

<div class="vip-bg" aria-hidden="true">
  <div class="vip-orb blue"></div>
  <div class="vip-orb red"></div>
  <canvas id="vipParticles"></canvas>
</div>

<div class="glow-extra"></div>
<div class="grain-overlay"></div>

<div class="page">
  <div class="hero-top">
    <div class="brand">
      <div class="brand-text">
        <p class="app-title">MK!</p>
        <p class="app-sub">TEMP MAIL</p>
      </div>
    </div>
  </div>

  <div class="card">
    <svg class="card-watermark" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
    <h2><span class="h2-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span> TEMPORARY EMAIL ADDRESS</h2>
    <div class="email-box placeholder" id="emailText">
      <span class="email-placeholder-inner">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        Click 'Generate New' to start
      </span>
    </div>
    <div class="expiry-note" id="expiryNote"></div>

    <div class="pill-stack">
      <button class="pill pill-primary" id="newBtn">
        <span class="pill-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
        GENERATE NEW
      </button>
      <button class="pill pill-copy" id="copyBtn">
        <span class="pill-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></span>
        Copy Address
      </button>
      <button class="pill pill-refresh" id="refreshBtn">
        <span class="pill-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></span>
        REFRESH INBOX
      </button>
    </div>
  </div>

  <div class="inbox-card">
    <div class="inbox-head">
      <div class="inbox-head-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"/></svg>
      </div>
      <div class="inbox-title-group">
        <span class="inbox-title">NEW SMS</span>
      </div>
      <span class="inbox-count" id="inboxCount"></span>
    </div>
    <hr class="divider">
    <div id="emptyState" class="empty-state">
      <div class="empty-illustration">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"/></svg>
      </div>
      <div class="pulse-row"><span class="pulse"></span>Generate an address to start receiving mail.</div>
    </div>
    <ul class="mail-list" id="mailList"></ul>
    <div id="expandedArea"></div>
  </div>

  <footer class="foot-note"><span style="font-weight: 900;color:#FFFFFF;">SOURCE CODE BY MK! X DEV-AI</span> | <span style="font-family: 'Nova Square', sans-serif;font-weight: 900;-webkit-text-stroke: 0.5px currentColor;color:#FF8C00;">MK! X DEV-AI</span></footer>
  <button class="pill pill-more-tools" style="display:flex;margin:14px auto 0;width:auto;padding:9px 22px;font-size:12.5px;" onclick="window.open('https://chat.whatsapp.com/LwyyYdV9uXAa6e','_blank')">FOR MORE FILE</button>
</div>

<div class="toast" id="toast">Address copied</div>

<script>
(function(){
  const API_BASE = 'https://api.guerrillamail.com/ajax.php';

  const emailText = document.getElementById('emailText');
  const copyBtn = document.getElementById('copyBtn');
  const newBtn = document.getElementById('newBtn');
  const refreshBtn = document.getElementById('refreshBtn');
  const toast = document.getElementById('toast');
  const expiryNote = document.getElementById('expiryNote');
  const mailList = document.getElementById('mailList');
  const emptyState = document.getElementById('emptyState');
  const inboxCount = document.getElementById('inboxCount');
  const expandedArea = document.getElementById('expandedArea');

  let hasAddress = false;
  let sidToken = null;
  let seconds = 600;
  let timerInterval = null;
  let pollInterval = null;
  let mails = [];
  let unreadCount = 0;
  let knownIds = new Set();

  function initials(from){
    const namePart = from.split('@')[0].replace(/[^a-zA-Z]/g,' ').trim();
    const parts = namePart.split(/\s+/).filter(Boolean);
    if(parts.length===0) return '?';
    if(parts.length===1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0]+parts[1][0]).toUpperCase();
  }

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(()=>toast.classList.remove('show'), 1800);
  }

  function formatTime(s){
    const m = Math.floor(s/60).toString().padStart(2,'0');
    const sec = (s%60).toString().padStart(2,'0');
    return `${m}:${sec}`;
  }

  const clockSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>';

  function startTimer(){
    clearInterval(timerInterval);
    seconds = 600;
    expiryNote.innerHTML = `${clockSvg}Expires in <strong>${formatTime(seconds)}</strong>`;
    timerInterval = setInterval(()=>{
      seconds--;
      if(seconds<=0){
        clearInterval(timerInterval);
        expiryNote.innerHTML = `${clockSvg}<strong>Expired</strong> — generate a new address`;
        return;
      }
      expiryNote.innerHTML = `${clockSvg}Expires in <strong>${formatTime(seconds)}</strong>`;
    },1000);
  }

  function updateInboxCount(){
    if(mails.length===0){
      inboxCount.textContent = '';
      emptyState.style.display = 'block';
      const msg = hasAddress
        ? 'Listening for incoming mail — this updates automatically.'
        : 'Generate an address to start receiving mail.';
      emptyState.querySelector('.pulse-row').innerHTML = `${msg}`;
    } else {
      inboxCount.textContent = `${unreadCount} unread · ${mails.length} total`;
      emptyState.style.display = 'none';
    }
  }

  function renderMailList(){
    mailList.innerHTML = '';
    mails.forEach((m, idx)=>{
      const li = document.createElement('li');
      li.className = 'mail-item' + (m.unread ? ' unread':'');
      li.innerHTML = `
        <div class="mail-avatar">${initials(m.from)}</div>
        <div class="mail-body">
          <div class="mail-top">
            <span class="mail-from">${m.from}</span>
            <span class="mail-time">${m.time}</span>
          </div>
          <div class="mail-subject">${m.subject}</div>
        </div>`;
      li.addEventListener('click', ()=>openMail(idx));
      mailList.appendChild(li);
    });
  }

  async function openMail(idx){
    const m = mails[idx];
    if(m.unread){ m.unread = false; unreadCount = Math.max(0, unreadCount-1); }
    renderMailList();
    updateInboxCount();
    expandedArea.innerHTML = `
      <div class="expanded-mail">
        <h3>${m.subject}</h3>
        <div class="exp-meta">From ${m.from} · ${m.time}</div>
        <p>Loading message…</p>
      </div>`;
    expandedArea.scrollIntoView({behavior:'smooth', block:'nearest'});
    try{
      const res = await fetch(`${API_BASE}?f=fetch_email&sid_token=${sidToken}&email_id=${m.id}`);
      const data = await res.json();
      const body = data.mail_excerpt || data.mail_body || 'No content';
      expandedArea.innerHTML = `
        <div class="expanded-mail">
          <h3>${m.subject}</h3>
          <div class="exp-meta">From ${m.from} · ${m.time}</div>
          <p>${body}</p>
          <button class="close-mail" id="closeMailBtn">Close</button>
        </div>`;
    } catch(e){
      expandedArea.innerHTML = `
        <div class="expanded-mail">
          <h3>${m.subject}</h3>
          <div class="exp-meta">From ${m.from} · ${m.time}</div>
          <p>Couldn't load this message.</p>
          <button class="close-mail" id="closeMailBtn">Close</button>
        </div>`;
    }
    document.getElementById('closeMailBtn').addEventListener('click', ()=>{ expandedArea.innerHTML=''; });
  }

  async function fetchInbox(showToastMsg){
    if(!sidToken) return;
    try{
      const res = await fetch(`${API_BASE}?f=get_email_list&sid_token=${sidToken}&offset=0`);
      const data = await res.json();
      const list = data.list || [];
      let newCount = 0;
      list.forEach(item=>{
        if(knownIds.has(item.mail_id)) return;
        knownIds.add(item.mail_id);
        newCount++;
        mails.unshift({
          id: item.mail_id,
          from: item.mail_from,
          subject: item.mail_subject || '(no subject)',
          time: new Date(item.mail_timestamp*1000).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
          unread: true
        });
        unreadCount++;
      });
      renderMailList();
      updateInboxCount();
      if(showToastMsg) showToast(newCount>0 ? `${newCount} new message(s)` : 'Inbox is up to date');
    } catch(e){
      if(showToastMsg) showToast('Could not reach inbox — try again');
    }
  }

  function resetInbox(){
    mails = [];
    unreadCount = 0;
    knownIds = new Set();
    expandedArea.innerHTML = '';
    renderMailList();
    updateInboxCount();
    clearInterval(pollInterval);
    pollInterval = setInterval(()=>fetchInbox(false), 8000);
  }

  async function generateNew(){
    showToast('Generating address…');
    try{
      const res = await fetch(`${API_BASE}?f=get_email_address`);
      const data = await res.json();
      sidToken = data.sid_token;
      hasAddress = true;
      emailText.textContent = data.email_addr;
      emailText.classList.remove('placeholder');
      emailText.classList.add('active');
      startTimer();
      resetInbox();
      showToast('New address generated');
    } catch(e){
      showToast('Could not generate address — try again');
    }
  }

  copyBtn.addEventListener('click', ()=>{
    if(!hasAddress){ showToast('Generate an address first'); return; }
    const text = emailText.textContent;
    if(navigator.clipboard){
      navigator.clipboard.writeText(text).then(()=>showToast('Address copied')).catch(()=>showToast('Copy failed — select manually'));
    } else {
      showToast('Copy not supported here');
    }
  });

  newBtn.addEventListener('click', generateNew);

  refreshBtn.addEventListener('click', ()=>{
    if(!hasAddress){ showToast('Generate an address first'); return; }
    fetchInbox(true);
  });
})();
</script>


<script id="vip-animation">
(function(){
  const c=document.getElementById('vipParticles'); if(!c)return;
  const ctx=c.getContext('2d'); let w=0,h=0,dpr=1,pts=[];
  function resize(){
    dpr=Math.min(devicePixelRatio||1,2); w=innerWidth; h=innerHeight;
    c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.min(85,Math.max(35,Math.floor(w*h/18000)));
    pts=Array.from({length:n},()=>({x:Math.random()*w,y:Math.random()*h,
      vx:(Math.random()-.5)*.32,vy:(Math.random()-.5)*.32,r:Math.random()*1.7+.4,
      red:Math.random()>.56}));
  }
  function frame(){
    ctx.clearRect(0,0,w,h);
    for(const p of pts){
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<-10)p.x=w+10;if(p.x>w+10)p.x=-10;
      if(p.y<-10)p.y=h+10;if(p.y>h+10)p.y=-10;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=p.red?'rgba(255,23,79,.72)':'rgba(24,168,255,.78)';
      ctx.shadowBlur=10;ctx.shadowColor=p.red?'#ff174f':'#18a8ff';ctx.fill();
    }
    ctx.shadowBlur=0;
    for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
      const a=pts[i],b=pts[j],dx=a.x-b.x,dy=a.y-b.y,dist=Math.hypot(dx,dy);
      if(dist<105){
        ctx.strokeStyle=(a.red||b.red)?`rgba(255,23,79,${(1-dist/105)*.10})`:`rgba(24,168,255,${(1-dist/105)*.10})`;
        ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
      }
    }
    requestAnimationFrame(frame);
  }
  addEventListener('resize',resize,{passive:true});resize();frame();
})();
